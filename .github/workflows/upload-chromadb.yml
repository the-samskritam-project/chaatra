name: Upload ChromaDB Index

on:
  workflow_dispatch:
    inputs:
      dictionary_hash:
        description: 'SHA256 hash of parsed_dictionary.json (auto-calculated if not provided)'
        required: false
        type: string

jobs:
  upload-chromadb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Calculate dictionary hash
      id: dict-hash
      run: |
        if [ -n "${{ inputs.dictionary_hash }}" ]; then
          HASH="${{ inputs.dictionary_hash }}"
        else
          HASH=$(sha256sum backend/chroma_db/parsed_dictionary.json | cut -d' ' -f1)
        fi
        echo "hash=$HASH" >> $GITHUB_OUTPUT
        echo "Dictionary hash: $HASH"

    - name: Check if ChromaDB files exist
      id: check-files
      run: |
        if [ -f "backend/chroma_db/chroma.sqlite3" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ ChromaDB files found in repository"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️  No ChromaDB files found in repository"
          echo ""
          echo "To upload ChromaDB files:"
          echo "1. Build locally: cd backend/chroma_db && ./build_chromadb_index.sh"
          echo "2. Temporarily commit the built files (chroma.sqlite3, UUID directories, etc.)"
          echo "3. Push to a branch"
          echo "4. Run this workflow on that branch"
          echo "5. After upload, remove the files from commit before merging"
          exit 1
        fi

    - name: Prepare ChromaDB artifact (exclude source files)
      if: steps.check-files.outputs.exists == 'true'
      run: |
        cd backend/chroma_db
        # Create a temporary directory with only built files
        mkdir -p ../chromadb-artifact
        # Copy all built files, excluding source files
        find . -maxdepth 1 -type f \( -name "*.sqlite3" -o -name "*.bin" -o -name "*.pickle" \) -exec cp {} ../chromadb-artifact/ \;
        # Copy UUID directories
        find . -maxdepth 1 -type d -name "[0-9a-f]*-[0-9a-f]*-[0-9a-f]*-[0-9a-f]*-[0-9a-f]*" -exec cp -r {} ../chromadb-artifact/ \;

    - name: Upload ChromaDB artifact
      if: steps.check-files.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: chromadb-index-${{ steps.dict-hash.outputs.hash }}
        path: backend/chromadb-artifact/
        retention-days: 90

    - name: Success message
      if: steps.check-files.outputs.exists == 'true'
      run: |
        echo "✅ ChromaDB artifact uploaded successfully!"
        echo "Artifact name: chromadb-index-${{ steps.dict-hash.outputs.hash }}"
        echo "This artifact will be available for 90 days"

